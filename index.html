<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/Logos/MIET%20Games.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MIET Games</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
            },
            colors: {
              brand: {
                amber: '#F59E0B',
                orange: '#EA580C',
                glow: 'rgba(245, 158, 11, 0.45)',
                navy: '#0B1120',
                deep: '#070D19',
                slate: '#1E293B',
                accent: '#38BDF8'
              },
              cyber: {
                bg: '#09081a',
                card: 'rgba(23, 20, 48, 0.72)',
                border: 'rgba(139, 92, 246, 0.25)',
                pink: '#ff2a85',
                cyan: '#00f2fe',
                gold: '#fbbf24',
                purple: '#8b5cf6'
              }
            },
            boxShadow: {
              'glow-amber': '0 0 25px -3px rgba(245, 158, 11, 0.4), 0 8px 16px -4px rgba(234, 88, 12, 0.3)',
              'card-elevated': '0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08)',
              neonPink: '0 0 20px -3px rgba(255, 42, 133, 0.45)',
              neonCyan: '0 0 22px -3px rgba(0, 242, 254, 0.45)',
              neonPurple: '0 0 25px -4px rgba(139, 92, 246, 0.35)',
              innerGlow: 'inset 0 1px 1px 0 rgba(255, 255, 255, 0.15)'
            },
            animation: {
              'float-slow': 'float 8s ease-in-out infinite',
              'pulse-subtle': 'pulseSubtle 4s ease-in-out infinite',
              'timer-glow': 'pulseGlow 2s infinite ease-in-out',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-8px)' },
              },
              pulseSubtle: {
                '0%, 100%': { opacity: '0.4' },
                '50%': { opacity: '0.7' },
              },
              pulseGlow: {
                '0%, 100%': { opacity: '0.8', transform: 'scale(1)' },
                '50%': { opacity: '1', transform: 'scale(1.02)' }
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
